services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyLive\Service\:
        resource: '../../Service/*'

    Wexample\SymfonyLive\Controller\:
        resource: '../../Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyLive\EventListener\:
        resource: '../../EventListener/*'

    Wexample\SymfonyLive\Service\LiveSubscriberTokenService:
        arguments:
            $jwtSecret: '%wexample_symfony_live.jwt_secret%'
            $hubPublicUrl: '%wexample_symfony_live.hub_public_url%'
            $ttlSeconds: '%wexample_symfony_live.subscriber_token_ttl%'
